<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JonMatTang in Seoul</title>
<meta name="description" content="Seoul restaurants, cafés, places and lifestyle spots, explained in English by a Seoul local.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#FBFAF7; --ink:#1B1B1B; --navy:#0C0141; --body:#33312D; --muted:#5C5A55; --soft:#45433F;
  --line:#E4E0D7; --line2:#ECE8E0; --border:#CFCAC0;
  --green:#2F5D50; --green-tint:#E6EFEB; --green-ink:#234A3F; --green-text:#D3DCD8;
  --orange:#B7410E; --orange-dark:#8A300A; --peach:#F6DCCB; --cream:#FBF4EE;
  --sand:#EDE8DE; --panel:#F4F1EA; --river:#CFE3EA; --river-ink:#1E4A5A;
  --display:'Bricolage Grotesque',sans-serif; --photo-ratio:4/5; --kr:'Noto Sans KR',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--orange)} a:hover{color:var(--orange-dark)}
button{font:inherit}
.kr{font-family:var(--kr)}
.display{font-family:var(--display);letter-spacing:-0.02em}
.btn-reset{background:none;border:0;padding:0;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

/* Shared header */
.topbar{padding:22px 40px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}
.brand{text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-0.02em}
.brand:hover{color:var(--ink)}
.navlinks{display:flex;flex-wrap:wrap;align-items:center;gap:20px;font-size:15px;font-weight:500}
.navlinks a,.navlinks button{color:var(--ink);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.navlinks .sep{color:#8C877E}
.navlinks .current{color:var(--muted)}

/* Pills */
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{min-height:36px;padding:0 13px;border-radius:999px;font:500 13px Inter,sans-serif;cursor:pointer;background:#fff;color:var(--ink);border:1px solid var(--border);display:inline-flex;align-items:center;gap:8px}
.pill[aria-pressed="true"],.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill .count{font-size:12px;color:var(--muted)}
.pill.on .count{background:#fff;color:var(--ink);border-radius:999px;padding:1px 7px}

.photo{background:var(--sand);color:#6B6760;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:13px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo.has-img{padding:0;background:var(--sand)}
.tag{background:var(--green-tint);color:var(--green-ink);padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
.eyebrow{margin:0;font-size:13px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--green)}
.empty{margin:0;border:1px dashed var(--border);border-radius:14px;padding:22px;color:var(--muted);font-size:15px}

/* ---------- HOME ---------- */
.home{display:flex;flex-wrap:wrap;min-height:100vh}
.home-main{flex:999 1 640px;min-width:0;padding:28px 40px 32px;display:flex;flex-direction:column;gap:22px}
.home-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.home-head .navlinks{gap:24px}
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.hero h1{margin:0;font-family:var(--display);font-weight:800;font-size:44px;line-height:1.05;letter-spacing:-0.03em;color:var(--navy);max-width:804px}
.hero .lede{margin:0;font-size:15px;line-height:1.55;color:var(--soft);max-width:890px;text-align:justify}
.map-wrap{flex-grow:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.map-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:40px}
.map-bar p{margin:0;font-size:15px;color:var(--soft)}
.map-bar strong{color:var(--orange-dark)}
.map-box{flex-grow:1;overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;align-items:center}
.map{width:100%;min-width:760px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(7,auto);gap:7px}
.tile{min-height:64px;padding:8px 4px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;cursor:pointer;font-family:Inter,sans-serif;background:#fff;color:var(--ink);border:1px solid #D6D1C7;text-decoration:none}
.tile:hover{border-color:var(--ink);color:var(--ink)}
.tile .en{font-size:13px;font-weight:600;line-height:1.2}
.tile .k{font-family:var(--kr);font-size:11px;color:var(--muted)}
.tile .badge{margin-top:1px;font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--orange);color:#fff}
.tile.has{background:var(--peach);border:2px solid var(--orange)}
.tile.sel{background:var(--ink);color:#fff;border:2px solid var(--ink)}
.tile.sel .k{color:#D9D6CF}
.river{grid-column:1/-1;grid-row:5;height:28px;border-radius:999px;background:var(--river);color:var(--river-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;letter-spacing:0.04em}
.how{margin-top:108px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;background:var(--green);color:#F3F1EC;border-radius:16px;padding:18px 22px}
.how h2{margin:0 0 4px;font-size:14px;font-weight:600}
.how p{margin:0;font-size:13px;line-height:1.5;color:var(--green-text)}
.home-panel{flex:1 1 380px;width:395px;max-width:100%;max-height:100vh;overflow-y:auto;position:sticky;top:0;background:#fff;border-left:1px solid var(--line);padding:28px 28px 24px;display:flex;flex-direction:column;gap:18px}
.home-panel h2{margin:0;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-0.02em}
.home-panel .sub{margin:4px 0 0;font-size:14px;color:var(--muted)}
.mini{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:14px;background:#fff}
.mini .photo{flex:0 0 104px;height:auto;align-self:flex-start;aspect-ratio:var(--photo-ratio);border-radius:10px;font-size:11px;padding:8px}
.mini .photo.has-img{padding:0}
.mini-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px}
.mini-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.mini h3{margin:0;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-0.01em}
.mini h3 .kr{font-family:var(--kr);font-weight:400;font-size:14px;color:var(--muted);margin-left:6px}
.mini p{margin:0;font-size:14px;line-height:1.5;color:var(--body)}
.mini .order{font-size:13px;line-height:1.45}
.order b{color:var(--orange-dark);font-weight:600}
.btn-dark{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:9px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;text-decoration:none}
.btn-dark:hover{color:#fff;background:#000}
.soon{display:inline-flex;align-items:center;min-height:40px;font-size:13px;color:var(--muted)}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.panel-toggle{flex-shrink:0;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--ink);font:500 13px Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.panel-toggle:hover{border-color:var(--ink)}
.panel-rail{flex:0 0 64px;position:sticky;top:0;height:100vh;border-left:1px solid var(--line);background:#fff;display:flex;justify-content:center;padding-top:28px}
.panel-rail button{writing-mode:vertical-rl;display:inline-flex;align-items:center;gap:10px;padding:16px 9px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--ink);font:600 13px Inter,sans-serif;letter-spacing:0.04em;cursor:pointer;height:fit-content}
.panel-rail button:hover{border-color:var(--ink)}
.panel-rail .n{writing-mode:horizontal-tb;background:var(--orange);color:#fff;border-radius:999px;padding:2px 7px;font-size:11px}
.panel-rail svg,.panel-toggle svg{width:14px;height:14px;flex-shrink:0}
.about{margin:auto 0 0;padding-top:16px;border-top:1px solid var(--line2);font-size:13px;line-height:1.55;color:var(--muted)}

/* ---------- DISTRICT ---------- */
.d-hero{padding:40px 40px 28px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 40px}
.d-hero .left{display:flex;flex-direction:column;gap:12px;max-width:760px}
.d-hero h1{margin:0;font-family:var(--display);font-weight:800;font-size:72px;line-height:1;letter-spacing:-0.03em}
.d-hero .kname{font-family:var(--kr);font-size:28px;color:var(--muted);margin-left:14px}
.d-hero p.intro{margin:0;font-size:17px;line-height:1.6;color:var(--body)}
.d-hero .pills{gap:8px}
.d-hero .pill{min-height:40px;padding:0 14px;font-size:14px}
.d-main{padding:0 40px 56px;display:flex;flex-direction:column;gap:40px}
.d-sec{display:flex;flex-direction:column;gap:18px;border-top:1px solid #DDD9D0;padding-top:28px;scroll-margin-top:16px}
.d-sec h2{margin:0;font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-0.02em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,235px));gap:16px}
.card{border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;text-decoration:none;color:var(--ink)}
a.card:hover{color:var(--ink);border-color:var(--ink)}
.card .photo{aspect-ratio:var(--photo-ratio)}
.card-body{padding:13px 14px 15px;display:flex;flex-direction:column;gap:6px;flex-grow:1}
.card .kind{font-size:10.5px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--green)}
.card .name{font-family:var(--display);font-weight:800;font-size:20px;line-height:1;letter-spacing:-0.02em}
.card .name .kr{font-family:var(--kr);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0;margin-left:6px}
.card .pitch{font-size:12.5px;line-height:1.45;color:var(--body);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mini .summary{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .order{font-size:11.5px;line-height:1.4;background:var(--cream);border-radius:7px;padding:6px 8px}
.card .tips{font-size:11.5px;line-height:1.4;color:var(--soft)}
.card .cta{margin-top:auto;padding-top:2px;font-size:12.5px;font-weight:600;color:var(--orange)}
.card .cta.off{color:var(--muted)}

/* ---------- PLACE ---------- */
.p-wrap{flex-grow:1;padding:28px 40px 32px;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.p-over{flex:1 1 400px;min-width:0;display:flex;flex-direction:column;gap:16px}
.p-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.p-meta .tag{font-size:13px;padding:4px 10px}
.p-over h1{margin:0;font-family:var(--display);font-weight:800;font-size:64px;line-height:1;letter-spacing:-0.03em}
.p-over h1 .kr{font-family:var(--kr);font-weight:400;font-size:24px;color:var(--muted);letter-spacing:0;margin-left:12px}
.rating{display:flex;align-items:center;gap:10px;margin-top:-4px}
.spoons{position:relative;display:inline-block;line-height:0}
.spoons .row{display:flex;gap:4px}
.spoons svg{width:26px;height:26px;flex-shrink:0}
.spoons .base svg{fill:#D9D2C5}
.spoons .fill{position:absolute;top:0;left:0;height:100%;overflow:hidden}
.spoons .fill svg{fill:var(--orange)}
.rating .score{font-size:15px;font-weight:600;color:var(--ink)}
.rating .of{font-weight:400;color:var(--muted)}
.p-over .lead{margin:0;font-size:17px;line-height:1.6;color:var(--body);text-align:justify;hyphens:auto}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gallery .photo{aspect-ratio:var(--photo-ratio);border-radius:14px}
.gallery .photo.big{grid-column:1/-1;border-radius:16px;font-size:14px}
.p-mid{flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:26px}
.p-mid h2{margin:0;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-0.02em}
.tbl-box{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
th{background:var(--panel);text-align:left;padding:11px 14px;font-weight:600}
td{padding:12px 14px;vertical-align:top;border-top:1px solid var(--line2);line-height:1.5;color:var(--body)}
td .m{font-weight:600;color:var(--ink)}
td .kr{color:var(--muted);font-size:13px}
td .chip{margin-top:5px;display:inline-block;font-size:11px;font-weight:600;color:var(--orange-dark);background:var(--cream);padding:2px 8px;border-radius:999px}
td.price{white-space:nowrap;color:var(--ink)}
td.price.tbd{color:var(--muted)}
.take h2{margin:0 0 12px !important}
.take p{margin:0 0 10px;font-size:15px;line-height:1.65;color:var(--body)}
.pair{background:var(--green-tint);border-radius:14px;padding:16px 18px}
.pair h2{font-family:Inter,sans-serif;font-size:15px;font-weight:600;color:var(--green-ink);letter-spacing:0;margin:0 0 8px}
.pair p{margin:0;font-size:15px;line-height:1.6;color:#1F3D35}
.check{flex:1 1 300px;max-width:360px;min-width:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px}
.check h2{margin:0;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-0.01em}
.check dl{margin:0;display:flex;flex-direction:column;gap:10px;font-size:14px}
.check dl div{display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line2);padding-bottom:9px}
.check dl div:last-child{border-bottom:0;padding-bottom:0}
.check dt{font-weight:600;color:var(--green)}
.check dd{margin:0;line-height:1.45;white-space:pre-line}
.btn-map{display:inline-flex;align-items:center;justify-content:center;min-height:46px;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;font-size:15px;text-decoration:none}
.btn-map:hover{color:#fff;background:#000}
.check .stamp{margin:0;font-size:12px;line-height:1.5;color:var(--muted)}
.p-foot{padding:8px 40px 32px}

@media (max-width:760px){
  .topbar,.home-main,.d-hero,.d-main,.p-wrap,.p-foot{padding-left:20px;padding-right:20px}
  .hero h1{font-size:34px}
  .d-hero h1{font-size:52px}
  .p-over h1{font-size:48px}
  .how{grid-template-columns:repeat(2,minmax(0,1fr))}
  .home-panel{position:static;max-height:none;border-left:0;border-top:1px solid var(--line)}
  .panel-rail{position:static;height:auto;flex:1 1 100%;border-left:0;border-top:1px solid var(--line);padding:12px 20px;justify-content:flex-start}
  .panel-rail button{writing-mode:horizontal-tb}
  .check{max-width:none}
}
</style>
</head>

<script>

/* Tile map: col 1-7, row 1-7 (row 5 is the Han River) */
var DISTRICTS = [
  { id: 'eunpyeong', en: 'Eunpyeong-gu', kr: '은평구', col: 2, row: 1,
    intro: 'Eunpyeong Hanok Village and Jingwansa Temple, tucked at the foot of Bukhansan Mountain.' },
  { id: 'gangbuk', en: 'Gangbuk-gu', kr: '강북구', col: 4, row: 1,

  { id: 'jongno', en: 'Jongno-gu', kr: '종로구', col: 3, row: 2,

  { id: 'seongbuk', en: 'Seongbuk-gu', kr: '성북구', col: 4, row: 2,

  { id: 'dongdaemun', en: 'Dongdaemun-gu', kr: '동대문구', col: 5, row: 2,

  { id: 'seongdong', en: 'Seongdong-gu', kr: '성동구', col: 4, row: 3,

  { id: 'gwangjin', en: 'Gwangjin-gu', kr: '광진구', col: 5, row: 3,

  { id: 'yongsan', en: 'Yongsan-gu', kr: '용산구', col: 3, row: 4,

  { id: 'gangseo', en: 'Gangseo-gu', kr: '강서구', col: 1, row: 6,

  { id: 'yangcheon', en: 'Yangcheon-gu', kr: '양천구', col: 2, row: 6,

  { id: 'yeongdeungpo', en: 'Yeongdeungpo-gu', kr: '영등포구', col: 3, row: 6,

  { id: 'dongjak', en: 'Dongjak-gu', kr: '동작구', col: 4, row: 6,

        '<aside class="check" aria-label="Visitor checklist"><h2>Visitor checklist</h2><dl>' + checks + '</dl>' +
          (p.mapUrl ? '<a class="btn-map" href="' + esc(p.mapUrl) + '" target="_blank" rel="noopener">Open in Naver Map</a>' : '') +
          '<p class="stamp">Last checked: ' + esc(p.lastChecked || '') + ' · #seoulooho</p>' +
        '</aside>' +
      '</div>' +
      '<footer class="p-foot">' + brand() + '</footer>' +
      '</div>';
    document.title = p.name + ' — ' + SITE.name;
  }

  /* ---------- Router & events ---------- */
  function route() {
    var parts = location.hash.replace(/^#\/?/, '').split('/');
    if (parts[0] === 'district' && DIST[parts[1]]) {
      renderDistrict(DIST[parts[1]]);
    } else if (parts[0] === 'place' && PLACE[parts[1]]) {
      var p = PLACE[parts[1]];
      if (p.guide) { renderPlace(p); } else { renderDistrict(DIST[p.district]); }
    } else {
      renderHome();
    }
    window.scrollTo(0, 0);
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var a = el.getAttribute('data-action');
    if (a === 'cat') { state.cat = el.getAttribute('data-cat'); renderHome(); }
    else if (a === 'district') {
      var id = el.getAttribute('data-id');
      state.district = state.district === id ? null : id;
      if (state.district && !state.panelOpen) { state.panelOpen = true; savePanel(); }  // show what was picked
      renderHome();
    }
    else if (a === 'toggle-panel') {
      state.panelOpen = !state.panelOpen; savePanel(); renderHome();
      var next = document.querySelector('[data-action="toggle-panel"]'); if (next) next.focus();
    }
    else if (a === 'clear') { state.district = null; renderHome(); }
    else if (a === 'jump') {
      var t = document.getElementById(el.getAttribute('data-target'));
      if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });

  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
